name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Validate release version discipline
      shell: pwsh
      run: .\tools\release\validate-release-version.ps1
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore nmolecules-roslyn/nMolecules.Roslyn.sln
    - name: Build
      run: dotnet build --no-restore nmolecules-roslyn/nMolecules.Roslyn.sln
    - name: Test
      run: dotnet test --no-build --verbosity normal nmolecules-roslyn/nMolecules.Roslyn.sln

  vscode-extension:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Validate release version discipline
      shell: pwsh
      run: .\tools\release\validate-release-version.ps1
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install VS Code extension dependencies
      run: npm install --prefix nmolecules-vscode
    - name: Test VS Code extension project
      run: npm test --prefix nmolecules-vscode
    - name: Run VS Code extension host smoke tests
      run: npm run test:host --prefix nmolecules-vscode

  visual-studio-installers:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Validate release version discipline
      shell: pwsh
      run: .\tools\release\validate-release-version.ps1
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build Visual Studio setup artifacts
      run: pwsh .\tools\packaging\build-ide-installers.ps1 -Configuration Release -SkipAnalyzerTests -SkipVsCodeTests -SkipVsCodePackage
    - name: Upload Visual Studio setup artifacts
      uses: actions/upload-artifact@v4
      with:
        name: visual-studio-installers
        path: artifacts/installers/visual-studio/**

  vscode-installers:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Validate release version discipline
      shell: pwsh
      run: .\tools\release\validate-release-version.ps1
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Build VS Code setup artifacts
      run: pwsh .\tools\packaging\build-ide-installers.ps1 -Configuration Release -SkipAnalyzerTests -SkipVsCodeTests -SkipVisualStudioVsix
    - name: Upload VS Code setup artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vscode-installers
        path: artifacts/installers/vscode/**
